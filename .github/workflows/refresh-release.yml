name: Rebuild reviewed platform ZIP release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching package.json
        type: string
        required: true
        default: V1.1.0
      review_approved:
        description: User authorized replacement after acceptance
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: metal-lab-release
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check approval and tag
        shell: pwsh
        env:
          APPROVED: ${{ inputs.review_approved }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if ($env:APPROVED -ne 'true') { throw 'User acceptance is required' }
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          if ($env:REQUESTED_TAG -ne "V$version") { throw 'Tag differs from package version' }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Rebuild and package
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          pnpm desktop:dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          pnpm desktop:linux
          if ($LASTEXITCODE -ne 0) { throw 'Linux build failed' }
          $hashes=@()
          foreach ($platform in @('Windows','Linux')) { $hashes+=(& ./scripts/package-release.ps1 -Platform $platform) }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'release-bundles/SHA256SUMS.txt'),$hashes,[Text.UTF8Encoding]::new($false))
      - name: Replace reviewed ZIPs and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          gh release upload $env:REQUESTED_TAG "release-bundles/MetalLab-$version-Windows-x64.zip" "release-bundles/MetalLab-$version-Linux-x64.zip" 'release-bundles/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed' }
