name: Publish reviewed Windows and Linux release
on:
  workflow_dispatch:
    inputs:
      review_approved:
        description: User has accepted this version and authorized publication
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: metal-lab-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify acceptance and version
        shell: pwsh
        env:
          APPROVED: ${{ inputs.review_approved }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:APPROVED -ne 'true') { throw 'User acceptance is required before publishing.' }
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "RELEASE_TAG=V$version" >> $env:GITHUB_ENV
          $releases=gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 1000|ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify existing releases' }
          if ($releases.tagName -contains "V$version") { throw 'Release already exists; use reviewed rebuild workflow' }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install, test and build both platforms
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          pnpm desktop:dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          pnpm desktop:linux
          if ($LASTEXITCODE -ne 0) { throw 'Linux build failed' }
      - name: Bundle and publish platform ZIP files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hashes=@()
          foreach ($platform in @('Windows','Linux')) { $hashes+=(& ./scripts/package-release.ps1 -Platform $platform) }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'release-bundles/SHA256SUMS.txt'),$hashes,[Text.UTF8Encoding]::new($false))
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          $files=@("release-bundles/MetalLab-$version-Windows-x64.zip","release-bundles/MetalLab-$version-Linux-x64.zip",'release-bundles/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG @files --repo $env:GITHUB_REPOSITORY --title $env:RELEASE_TAG --target $env:GITHUB_SHA --notes-file "docs/releases/$($env:RELEASE_TAG).md"
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
