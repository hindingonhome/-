name: Publish reviewed small WebView2 edition
on:
  workflow_dispatch:
    inputs:
      edition:
        type: choice
        options: [Standard, Lite]
        required: true
      review_approved:
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: small-release-${{ inputs.edition }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Check, build and publish separate edition
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION: ${{ inputs.edition }}
          APPROVED: ${{ inputs.review_approved }}
        run: |
          if ($env:APPROVED -ne 'true') { throw 'Publication authorization required' }
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          $tag="V$version"; $name="MetalLab-$version"; $stage='standard-slim-dist'
          if ($env:EDITION -eq 'Lite') { $version=(Get-Content scripts/lite-profile.json -Raw|ConvertFrom-Json).version; $tag="Lite-V$version"; $name="MetalLab-Lite-$version"; $stage='slim-dist' }
          $existing=gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 1000|ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $existing.tagName -contains $tag) { throw 'Cannot verify new release tag or tag already exists' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          pnpm build:lite:web
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          ./scripts/fetch-webview-sdk.ps1
          ./scripts/build-lite-slim.ps1 -Edition $env:EDITION -Output $stage
          ./scripts/package-small-release.ps1 -Edition $env:EDITION -Output release-bundles/small
          $output='release-bundles/small'
          Copy-Item "$output/$tag-SHA256SUMS.txt" "$output/SHA256SUMS.txt"
          $files=@("$output/$name-Windows-x64.zip","$output/SHA256SUMS.txt")
          if ($env:EDITION -eq 'Lite') { $files+="$output/$name-iPhone-Web.zip" }
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "$env:EDITION $version · WebView2" --notes-file "docs/releases/$tag.md" --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
